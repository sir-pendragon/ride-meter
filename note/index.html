<style>

:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

  --route:#8FA2FF; --camp:#E59A5E; --ok:#6CC78F; --warn:#F0946B;
  --d1:#8FA2FF; --d2:#4FC9B7; --d3:#B98CF0; --d4:#E2B947; --d5:#F08AA8; color-scheme:dark}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:0 64px}

.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:20px}

@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.form{display:flex;flex-direction:column;gap:12px}

.form input[type=text],.form input[type=date],.form input[type=time],.form input[type=number],.form input[type=url],.form textarea,.form select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 10px;font-size:15px;width:100%;box-sizing:border-box}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hint{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:30;max-width:calc(100% - 32px);font-size:14px}

@media (min-width:600px){html{background:var(--paper)}body{max-width:480px;margin:0 auto;box-shadow:0 0 0 1px var(--line);min-height:100vh}.wrap{max-width:none}}
</style>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FAC=['水場','トイレ','炊事場','風呂・シャワー','電源','売店','直火可','ゴミ捨て可'];
const DAYC=['--d1','--d2','--d3','--d4','--d5'];
const S={db:null,user:null,uid:null,canWrite:null,trips:[],tripsLoaded:false,trip:null,tripId:null,tracks:[],entries:[],unsubs:[],names:{},asked:new Set(),sel:null,pick:null,proj:null,busy:false};

/* ---------- utils ---------- */
function toast(m,ms=3200){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms)}
function errMsg(e){const c=e&&e.code;if(c==='quota_exceeded')return '保存容量の上限に達しました。古い写真や軌跡を削除してから再度お試しください。';if(c==='invalid_argument'){return '保存できませんでした。編集権限がないか、データが大きすぎます。'}if(c==='resource_exhausted')return '操作が集中しています。少し待ってから再度お試しください。';return '保存できませんでした('+(c||'不明なエラー')+')。時間をおいて再度お試しください。'}
function dkey(ms){const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hm(sec){const d=new Date(sec*1000);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function mdj(k){if(!k)return '';const[y,m,d]=k.split('-').map(Number);const w='日月火水木金土'[new Date(y,m-1,d).getDay()];return m+'/'+d+'('+w+')'}
function daysBetween(a,b){const p=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)}
function km(m){return (m/1000).toFixed(m<10000?2:1)}
function hav(a,b){const R=6371008.8,r=Math.PI/180;const dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;const s=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(s)))}
function safeImg(u){return typeof u==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(u)?u:''}
function safeUrl(u){return typeof u==='string'&&/^https?:\/\//i.test(u)?u:''}
function parseLoc(s){if(!s)return null;{const q=String(s).match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);if(q){const la=+q[1],lo=+q[2];if(Math.abs(la)<=90&&Math.abs(lo)<=180)return[la,lo]}}const m=String(s).replace(/geo:/i,'').match(/(-?\d+(?:\.\d+)?)\s*°?\s*[, ]\s*(-?\d+(?:\.\d+)?)/);if(!m)return null;const la=+m[1],lo=+m[2];if(Math.abs(la)>90||Math.abs(lo)>180)return null;return[la,lo]}
const hasLoc=e=>typeof e.lat==='number'&&typeof e.lon==='number'&&Number.isFinite(e.lat)&&Number.isFinite(e.lon)&&Math.abs(e.lat)<=90&&Math.abs(e.lon)<=180;
function fmtLoc(la,lo){return la==null?'':la.toFixed(5)+', '+lo.toFixed(5)}

/* ---------- geometry ---------- */
function dp(pts,tol){if(pts.length<3)return pts.slice();const r=Math.PI/180,c=Math.cos(pts[0][0]*r);const P=pts.map(p=>[p[1]*111320*c,p[0]*110574]);const keep=new Uint8Array(pts.length);keep[0]=keep[pts.length-1]=1;const st=[[0,pts.length-1]];while(st.length){const[a,b]=st.pop();let md=0,mi=-1;const[ax,ay]=P[a],[bx,by]=P[b],dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;for(let i=a+1;i<b;i++){const[px,py]=P[i];let t=L?((px-ax)*dx+(py-ay)*dy)/L:0;t=t<0?0:t>1?1:t;const ex=ax+t*dx-px,ey=ay+t*dy-py,d=ex*ex+ey*ey;if(d>md){md=d;mi=i}}if(mi>=0&&md>tol*tol){keep[mi]=1;st.push([a,mi],[mi,b])}}return pts.filter((_,i)=>keep[i])}
function simplify(segs,budget){let tol=1.5,out=segs;for(let k=0;k<16;k++){out=segs.map(s=>dp(s,tol));if(out.reduce((a,s)=>a+s.length,0)<=budget)return out;tol*=1.7}return out}
function rawStats(segs){let d=0,gain=0;const days={};for(const s of segs){let base=null;for(let i=0;i<s.length;i++){if(i){const dd=hav(s[i-1],s[i]);d+=dd;const t=s[i][3]??s[i-1][3];if(t!=null){const k=dkey(t*1000);days[k]=(days[k]||0)+dd}}const e=s[i][2];if(e!=null){if(base==null)base=e;else if(e-base>=3){gain+=e-base;base=e}else if(base-e>=3)base=e}}}return{dist:Math.round(d),gain:Math.round(gain),days:Object.fromEntries(Object.entries(days).map(([k,v])=>[k,Math.round(v)]))}}
function compact(segs){return segs.map(s=>s.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6),p[2]==null?null:+p[2].toFixed(1),p[3]==null?null:Math.round(p[3])]))}
function packTrack(segs){let b=3000,pk;for(let k=0;k<6;k++){pk=compact(simplify(segs,b));if(JSON.stringify(pk).length<230000)return pk;b=Math.floor(b*.65)}return pk}
function segsOf(tr){const s=tr&&tr.segs;return Array.isArray(s)?s.filter(Array.isArray).map(x=>x.filter(p=>Array.isArray(p)&&isFinite(p[0])&&isFinite(p[1]))):[]}

/* ---------- parsers ---------- */
function parseGPX(text){const x=new DOMParser().parseFromString(text,'application/xml');if(x.getElementsByTagName('parsererror').length)throw new Error('GPXとして読めませんでした');const segs=[];const take=nodes=>{const s=[];for(const n of nodes){const la=parseFloat(n.getAttribute('lat')),lo=parseFloat(n.getAttribute('lon'));if(!isFinite(la)||!isFinite(lo))continue;const e=n.getElementsByTagName('ele')[0],t=n.getElementsByTagName('time')[0];const ev=e?parseFloat(e.textContent):NaN;const tv=t?Date.parse(t.textContent.trim()):NaN;s.push([la,lo,isFinite(ev)?ev:null,isFinite(tv)?tv/1000:null])}if(s.length>1)segs.push(s)};const ts=x.getElementsByTagName('trkseg');if(ts.length){for(const g of ts)take(g.getElementsByTagName('trkpt'))}else{for(const r of x.getElementsByTagName('rte'))take(r.getElementsByTagName('rtept'))}if(!segs.length)throw new Error('GPX内に軌跡(trkpt)が見つかりませんでした');const nm=x.getElementsByTagName('name')[0];return{segs,name:nm?nm.textContent.trim():''}}
function parseTimeline(json,fromMs,toMs){const out=[];const tOf=v=>{if(v==null)return NaN;if(typeof v==='number')return v>1e12?v:v*1000;const n=Number(v);if(isFinite(n)&&String(v).length>=12)return n;return Date.parse(v)};
  const walk=(o,ctxStart,depth)=>{if(!o||typeof o!=='object'||depth>12)return;if(Array.isArray(o)){for(const v of o)walk(v,ctxStart,depth+1);return}
    const st=o.startTime||o.startTimestamp||o.startTimestampMs||(o.duration&&o.duration.startTimestamp)||ctxStart;
    let la=null,lo=null,t=NaN;
    if(o.latitudeE7!=null&&o.longitudeE7!=null){la=o.latitudeE7/1e7;lo=o.longitudeE7/1e7;t=tOf(o.timestamp??o.timestampMs??o.timestampUtc)}
    else if(o.latE7!=null&&o.lngE7!=null){la=o.latE7/1e7;lo=o.lngE7/1e7;t=tOf(o.timestamp??o.timestampMs)}
    else if(typeof o.point==='string'){const p=parseLoc(o.point);if(p){[la,lo]=p;t=tOf(o.time);if(!isFinite(t)&&o.durationMinutesOffsetFromStartTime!=null&&ctxStart)t=tOf(ctxStart)+Number(o.durationMinutesOffsetFromStartTime)*60000}}
    else if(typeof o.LatLng==='string'||typeof o.latLng==='string'){const p=parseLoc(o.LatLng||o.latLng);if(p&&(o.timestamp||o.time)){[la,lo]=p;t=tOf(o.timestamp||o.time)}}
    if(la!=null&&isFinite(t)){out.push([la,lo,o.altitude!=null&&isFinite(+o.altitude)?+o.altitude:null,t/1000]);}
    for(const k in o){const v=o[k];if(v&&typeof v==='object')walk(v,st,depth+1)}};
  walk(json,null,0);
  const f=out.filter(p=>p[3]*1000>=fromMs&&p[3]*1000<=toMs&&Math.abs(p[0])<=90&&Math.abs(p[1])<=180).sort((a,b)=>a[3]-b[3]);
  const ded=[];for(const p of f){const q=ded[ded.length-1];if(q&&q[3]===p[3]&&q[0]===p[0])continue;ded.push(p)}
  const segs=[];let cur=[];for(const p of ded){const q=cur[cur.length-1];if(q&&(p[3]-q[3]>3*3600))  {if(cur.length>1)segs.push(cur);cur=[]}cur.push(p)}if(cur.length>1)segs.push(cur);
  return{segs,count:ded.length,found:out.length,pts:ded}}
/* Googleタイムラインの「移動手段つきの区間」を取り出す。

function nice(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*p}

function splitByDay(s){const out=[];let cur=[],ck=null;for(const p of s){const k=p[3]!=null?dkey(p[3]*1000):null;if(cur.length&&k!==ck&&k!=null&&ck!=null){cur.push(p);out.push({k:ck,pts:cur});cur=[p]}else cur.push(p);if(k!=null)ck=k}if(cur.length>1)out.push({k:ck,pts:cur});return out}
function mapSVG(){const allSegs=S.tracks.map(segsOf);const located=mapEntries();const bb=bboxOf(allSegs,located.map(e=>[e.lat,e.lon]));if(!bb){S.proj=null;return '<div class="empty" style="margin:12px">GPXやタイムラインを取り込むと、ここにルートが描かれます。位置情報付きの写真やキャンプ場も地図に載ります。</div>'}

function profileSVG(){const pts=[];let acc=0;const trs=S.tracks.slice().sort((a,b)=>(a.t0??9e12)-(b.t0??9e12));for(const tr of trs)for(const s of segsOf(tr)){for(let i=0;i<s.length;i++){if(i)acc+=hav(s[i-1],s[i]);if(s[i][2]!=null)pts.push([acc/1000,s[i][2],s[i][3]])}}

function renderNoDb(){$('#view').innerHTML=`<div class="empty"><p><b>この端末のブラウザでは、保存領域を使えません。</b></p><p class="hint">プライベート(シークレット)モードでないか確認してください。</p></div>`}
function previewSVG(t){const pv=Array.isArray(t.preview)?t.preview.filter(Array.isArray):[];const bb=bboxOf([pv],[]);if(!bb)return `<svg viewBox="0 0 320 200"><text x="160" y="104" text-anchor="middle" font-size="13" fill="var(--muted)">軌跡なし</text></svg>`;const P=mkProj(bb,320,18,200);return `<svg viewBox="0 0 320 200" aria-hidden="true"><rect width="320" height="200" fill="var(--sea)"/>${landSVG(P)}${pv.map(s=>`<path d="${pathD(s,P)}" fill="none" stroke="var(--route)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}</svg>`}
function renderList(){const can=S.canWrite!==false;let h=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">自転車キャンプの旅の記録</div><h2 style="font-size:20px">旅の一覧</h2></div>${can?'<button class="btn" data-act="new-trip">＋ 新しい旅</button>':''}</div>`;
  if(!S.tripsLoaded)h+=`<div class="empty" style="margin-top:16px">読み込み中…</div>`;
  else if(!S.trips.length)h+=`<div class="empty" style="margin-top:16px"><p><b>まだ旅の記録がありません。</b></p><p class="hint">「新しい旅」から旅を作り、GPXファイル・写真・Googleマップのタイムラインを取り込むと、ルート図と日ごとの記録ができあがります。</p></div>`;
  else h+=`<div class="list">${S.trips.map(t=>{const n=t.start&&t.end?daysBetween(t.start,t.end):null;return `<a class="trip-card" href="#${esc(t._id)}">${previewSVG(t)}<div class="eyebrow">${esc(mdj(t.start))}${t.end&&t.end!==t.start?' – '+esc(mdj(t.end)):''}${t.start?' '+esc(t.start.slice(0,4)):''}</div><h3>${esc(t.title||'無題の旅')}${t.sample?'<span class="tag">サンプル</span>':''}</h3><div class="muted num" style="font-size:13px">${t.dist!=null?km(t.dist)+' km':'— km'} ・ ↑${t.gain!=null?t.gain:'—'} m${n!=null?' ・ '+(n>0?n+'泊'+(n+1)+'日':'日帰り'):''}</div></a>`}).join('')}</div>`;
  h+=`<section class="panel" style="margin-top:20px;padding:14px"><div class="row" style="gap:8px"><button class="btn ghost small" data-act="backup-out">全データを書き出す</button><button class="btn ghost small" data-act="backup-in">ファイルから読み込む</button></div><p class="hint" style="margin:8px 0 0">記録はこの端末のブラウザ内にだけ保存されます。機種変更やブラウザのデータ削除に備えて、ときどき書き出してください。書き出したファイルは、別の端末に読み込んで共有にも使えます。</p><input type="file" id="bk-file" hidden></section>`;
  $('#view').innerHTML=h}
function stars(n){n=Math.max(0,Math.min(5,Math.round(n||0)));return '★'.repeat(n)+'☆'.repeat(5-n)}
function entryHTML(e){const can=S.canWrite!==false;const who=e.createdBy&&S.names[e.createdBy]?S.names[e.createdBy]:'';const kindL={diary:'日記',photo:'写真',camp:'キャンプ場',video:'動画'}[e.kind]||'メモ';let b='';
  if(e.kind==='camp'){const c=e.camp||{};b+=`<div style="font-weight:700;font-size:16px;margin-top:2px">${esc(c.name||'名称未入力')}</div><div class="row" style="gap:12px;font-size:13px">${c.rating?`<span class="stars" aria-label="評価${c.rating}">${stars(c.rating)}</span>`:''}${c.fee!=null&&c.fee!==''?`<span class="num">¥${Number(c.fee).toLocaleString('ja-JP')}</span>`:''}</div>${Array.isArray(c.facilities)&&c.facilities.length?`<div class="facs">${c.facilities.map(f=>`<span>${esc(f)}</span>`).join('')}</div>`:''}`}
  const img=safeImg(e.img);if(img)b+=`<img src="${img}" alt="${esc(e.text||'旅の写真')}" loading="lazy">`;
  if(e.text)b+=`<p>${esc(e.text)}</p>`;const u=safeUrl(e.url);if(u)b+=`<p><a href="${esc(u)}" target="_blank" rel="noopener">${esc(e.kind==='video'?'動画を開く':'リンクを開く')} ↗</a></p>`;
  const loc=hasLoc(e);
  const estHint=e.kind==='camp'&&!loc&&mapEntries().some(q=>q._id===e._id)?'<p class="hint" style="margin:4px 0 0">位置は未設定です。地図には、その日の最終地点に仮表示しています。「編集」で正しい位置を指定できます。</p>':'';
  return `<article class="entry ${esc(e.kind)}${S.sel===e._id?' sel':''}" id="e-${esc(e._id)}"><div class="meta"><span class="kind">${kindL}</span>${e.t?`<span class="num">${hm(e.t)}</span>`:''}${loc?`<span class="num">${fmtLoc(e.lat,e.lon)}</span>`:''}${who?`<span>記録: ${esc(who)}</span>`:''}</div>${b}${estHint}<div class="acts">${loc?`<button class="btn ghost small" data-act="focus" data-id="${esc(e._id)}">地図で見る</button><a class="btn ghost small" href="https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lon}" target="_blank" rel="noopener">Googleマップ ↗</a>`:''}${can?`<button class="btn ghost small" data-act="edit-entry" data-id="${esc(e._id)}">編集</button><button class="btn ghost small" data-act="del-entry" data-id="${esc(e._id)}">削除</button>`:''}</div></article>`}
function renderTrip(){const t=S.trip;if(!t){$('#view').innerHTML=S.tripsLoaded?`<div class="empty"><p>この旅は見つかりませんでした。</p><a href="#">一覧へ戻る</a></div>`:`<div class="empty">読み込み中…</div>`;return}
  const can=S.canWrite!==false;let dist=0,gain=0;const dayKm={};for(const tr of S.tracks){dist+=tr.dist||0;gain+=tr.gain||0;for(const[k,v]of Object.entries(tr.days||{}))dayKm[k]=(dayKm[k]||0)+v}
  const nights=t.start&&t.end?daysBetween(t.start,t.end):null;const camps=S.entries.filter(e=>e.kind==='camp').length;
  let h=`<div class="trip-head"><a href="#" class="muted" style="font-size:13px;text-decoration:none">← 旅の一覧</a><div class="eyebrow">${esc(mdj(t.start))}${t.end&&t.end!==t.start?' – '+esc(mdj(t.end)):''} ${esc((t.start||'').slice(0,4))}${t.bike?' ・ '+esc(t.bike):''}</div><h2>${esc(t.title||'無題の旅')}${t.sample?'<span class="tag">サンプル</span>':''}</h2>${t.note?`<p style="margin:0;white-space:pre-wrap">${esc(t.note)}</p>`:''}${can?`<div class="row"><button class="btn small" data-act="import">取り込む</button><button class="btn ghost small" data-act="add" data-kind="camp">キャンプ場</button><button class="btn ghost small" data-act="edit-trip">旅の情報</button><button class="btn ghost small" data-act="trip-out">この旅を書き出す</button></div>`:''}</div>`;
  h+=`<div class="stats"><div><b>${km(dist)}</b><span>走行距離 km</span></div><div><b>${gain.toLocaleString('ja-JP')}</b><span>獲得標高 m（参考値）</span></div><div><b>${nights==null?'—':nights>0?nights+'泊'+(nights+1)+'日':'日帰り'}</b><span>日程</span></div><div><b>${camps}</b><span>キャンプ場</span></div></div>`;
  if(S.pick)h+=`<div class="banner"><span>地図上の位置をタップしてください</span><button class="btn small" data-act="pick-cancel" style="background:var(--paper);color:var(--ink);border-color:var(--paper)">やめる</button></div>`;
  h+=`<section class="panel map"><div class="panel-h"><b>ルート図</b><span class="muted">海岸線: Natural Earth（約1:1000万）</span></div>${mapSVG()}<div class="legend">${legendHTML()}</div></section>`;
  const prof=profileSVG();if(prof)h+=`<section class="panel prof"><div class="panel-h"><b>標高プロファイル</b><span class="muted">GPSの標高値。誤差を含みます</span></div>${prof}</section>`;
  // days
  const keys=new Set(Object.keys(dayKm));const byDay={};const nod=[];for(const e of S.entries){if(e.date){keys.add(e.date);(byDay[e.date]=byDay[e.date]||[]).push(e)}else nod.push(e)}
  if(t.start&&t.end&&t.end>=t.start){const[y,m,d]=t.start.split('-').map(Number);for(let n=0;n<=Math.min(60,daysBetween(t.start,t.end));n++)keys.add(dkey(new Date(y,m-1,d+n).getTime()))}
  const ks=[...keys].sort();h+=`<div class="section-h"><h3>日ごとの記録</h3><span class="muted" style="font-size:13px">${S.entries.length}件</span></div>`;
  if(!ks.length&&!nod.length)h+=`<div class="empty">キャンプ場の記録はまだありません。${can?'上の「キャンプ場」から書き始めましょう。':''}</div>`;
  for(const k of ks){const i=dayIndex(k);const es=(byDay[k]||[]).slice().sort((a,b)=>(a.t??9e12)-(b.t??9e12)||(a.createdAt||'').localeCompare(b.createdAt||''));
    const head=`<span class="sw" style="background:${dayColor(i)}"></span><span class="dn">${i+1}日目</span><span>${esc(mdj(k))}</span>${dayKm[k]?`<span class="num muted">${km(dayKm[k])} km</span>`:''}`;
    h+=`<section class="day">${can?`<button class="day-h" data-act="day-add" data-date="${esc(k)}" aria-label="${i+1}日目 ${esc(mdj(k))} に記録を追加">${head}<span class="plus">＋ 追加</span></button>`:`<div class="day-h">${head}</div>`}<div class="entries">${es.map(entryHTML).join('')}${can?`<button class="day-add" data-act="day-add" data-date="${esc(k)}">${es.length?'＋ キャンプ場を追加':'＋ この日のキャンプ場を記録'}</button>`:(es.length?'':'<div class="muted" style="font-size:13px">この日の記録はまだありません。</div>')}</div></section>`}
  if(nod.length)h+=`<section class="day"><div class="day-h"><span class="dn" style="font-size:16px">日付なし</span></div><div class="entries">${nod.map(entryHTML).join('')}</div></section>`;
  // gear
  const gear=Array.isArray(t.gear)?t.gear:[];h+=`<div class="section-h"><h3>車体と装備</h3>${can?'<button class="btn ghost small" data-act="edit-trip">編集</button>':''}</div>${t.bike?`<p style="margin:0 0 8px"><b>${esc(t.bike)}</b></p>`:''}${gear.length?`<div class="gear">${gear.map(g=>`<span>${esc(g)}</span>`).join('')}</div>`:'<p class="muted" style="margin:0">装備はまだ登録されていません。</p>'}`;
  // tracks
  h+=`<div class="section-h"><h3>取り込んだ軌跡</h3><span class="muted" style="font-size:13px">${S.tracks.length}件</span></div>`;
  h+=S.tracks.length?`<div class="panel tracks">${S.tracks.map(tr=>`<div><span>${esc(tr.name||'軌跡')} <span class="muted">(${tr.source==='timeline'?'タイムライン':'GPX'})</span></span><span class="row"><span class="num muted">${km(tr.dist||0)} km</span>${S.dl?`<button class="btn ghost small" data-act="gpx-track" data-id="${esc(tr._id)}">GPX</button>`:''}${can?`<button class="btn ghost small" data-act="del-track" data-id="${esc(tr._id)}">削除</button>`:''}</span></div>`).join('')}</div>${S.dl?`<div class="row" style="margin-top:8px"><button class="btn ghost small" data-act="gpx-all">すべての軌跡を1つのGPXで書き出す</button></div><p class="hint" style="margin-top:4px">GPXはzipに入れて保存します。保存される軌跡は、取り込み時に間引いた後のデータです。</p>`:''}`:'<p class="muted" style="margin:0">まだありません。</p>';
  if(can)h+=`<div style="margin-top:28px"><button class="btn danger small" data-act="del-trip">この旅を削除</button></div>`;
  $('#view').innerHTML=h;resolveNames()}
async function resolveNames(){if(!S.user)return;const ids=[...new Set(S.entries.map(e=>e.createdBy).filter(Boolean))].filter(i=>!S.asked.has(i));if(!ids.length)return;ids.forEach(i=>S.asked.add(i));try{const ps=await S.user.profiles(ids);let ch=false;for(const i of ids){const n=ps&&ps[i]&&ps[i].name||'';if(n){S.names[i]=n;ch=true}}if(ch&&S.tripId)renderTrip()}catch(e){}}

/* ---------- sheet ---------- */
function openSheet(html,mount){const sh=$('#sheet');sh.innerHTML=html;$('#scrim').hidden=false;mount&&mount(sh);const f=sh.querySelector('input,textarea,select');f&&f.focus({preventScroll:true})}
function closeSheet(){$('#scrim').hidden=true;$('#sheet').innerHTML=''}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim'&&!S.busy)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden&&!S.busy)closeSheet()});
function confirmSheet(msg,label,fn){openSheet(`<h3>${esc(msg)}</h3><p class="hint">この操作は取り消せません。</p><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" id="c-no">やめる</button><button class="btn danger" id="c-yes">${esc(label)}</button></div>`,sh=>{sh.querySelector('#c-no').onclick=closeSheet;sh.querySelector('#c-yes').onclick=async()=>{const b=sh.querySelector('#c-yes');b.disabled=true;try{await fn();closeSheet()}catch(e){toast(errMsg(e));b.disabled=false}}})}

function dayAddSheet(k){const i=dayIndex(k);
  openSheet(`<h3>${i+1}日目 ${esc(mdj(k))} に追加</h3><div class="choices">
    <button class="btn" data-k="camp">キャンプ場</button><button class="btn" data-k="photo">写真</button>
    <button class="btn ghost" data-k="video">動画リンク</button></div>
    <input type="file" id="d-photo" accept="image/*" multiple hidden>
    <p class="hint" style="margin-top:10px">写真は撮影日時と位置(EXIF)を読み取ります。撮影日時がない写真はこの日の記録になります。</p>
    <div class="prog" id="d-prog" aria-live="polite"></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost" id="d-close">閉じる</button></div>`,sh=>{
    sh.querySelector('#d-close').onclick=()=>{if(!S.busy)closeSheet()};
    sh.querySelector('.choices').onclick=e=>{const b=e.target.closest('[data-k]');if(!b||S.busy)return;const kind=b.dataset.k;if(kind==='photo'){sh.querySelector('#d-photo').click();return}entryForm(kind,{kind,date:k})};
    sh.querySelector('#d-photo').onchange=async e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;const prog=sh.querySelector('#d-prog');S.busy=true;sh.querySelectorAll('.choices .btn').forEach(x=>x.disabled=true);let ok=0,ng=0;
      try{for(let j=0;j<files.length;j++){const f=files[j];prog.textContent=`写真を保存中 ${j+1}/${files.length}`;try{const ex=await readExif(f);const img=await shrink(f);let la=ex.lat,lo=ex.lon;if(la==null){const p=locAtTime(ex.t);if(p)[la,lo]=p}
        await S.db.collection('trips/'+S.tripId+'/entries').doc().set({kind:'photo',img,text:'',t:ex.t??null,date:ex.t?dkey(ex.t*1000):k,lat:la??null,lon:lo??null,createdBy:S.uid||null,createdAt:new Date().toISOString()});ok++}catch(er){if(er&&er.code)throw er;ng++}}
        closeSheet();toast(`写真を${ok}枚保存しました${ng?`(${ng}枚は読めませんでした)`:''}`)}
      catch(er){handleWriteErr(er);prog.textContent=''}finally{S.busy=false;sh.querySelectorAll('.choices .btn').forEach(x=>x.disabled=false)}}})}
function tripForm(t){t=t||{};const today=dkey(Date.now());openSheet(`<h3>${t._id?'旅の情報':'新しい旅'}</h3><form class="form" id="f"><label>旅の名前<input type="text" id="f-title" required maxlength="80" value="${esc(t.title||'')}" placeholder="例: 秩父 林道とキャンプの2泊3日"></label><div class="two"><label>出発日<input type="date" id="f-start" required value="${esc(t.start||today)}"></label><label>帰着日<input type="date" id="f-end" required value="${esc(t.end||t.start||today)}"></label></div><label>車体<input type="text" id="f-bike" maxlength="80" value="${esc(t.bike||'')}" placeholder="例: PENDRAGON チタン グラベル"></label><label>装備(1行に1つ)<textarea id="f-gear" placeholder="テント\n寝袋 (快適温度5℃)\nバーナー">${esc((t.gear||[]).join('\n'))}</textarea></label><label>メモ<textarea id="f-note" maxlength="2000" style="min-height:64px">${esc(t.note||'')}</textarea></label><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="f-cancel">やめる</button><button class="btn" id="f-save">保存</button></div></form>`,sh=>{sh.querySelector('#f-cancel').onclick=closeSheet;sh.querySelector('#f').onsubmit=async ev=>{ev.preventDefault();const v=id=>sh.querySelector(id).value.trim();const st=v('#f-start'),en=v('#f-end');if(en<st){toast('帰着日は出発日以降にしてください');return}const data={title:v('#f-title'),start:st,end:en,bike:v('#f-bike'),gear:v('#f-gear').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,80),note:v('#f-note')};const b=sh.querySelector('#f-save');b.disabled=true;try{if(t._id){await S.db.doc('trips/'+t._id).update(data)}else{const ref=S.db.collection('trips').doc();await ref.set({...data,createdBy:S.uid||null,createdAt:new Date().toISOString(),dist:0,gain:0,preview:[]});closeSheet();location.hash=ref.id;return}closeSheet()}catch(e){b.disabled=false;handleWriteErr(e)}}})}

function entryForm(kind,e){e=e||{kind};const t=S.trip;const def=e.date||(t&&t.start)||dkey(Date.now());const c=e.camp||{};const title={diary:'日記',camp:'キャンプ場',photo:'写真',video:'動画リンク'}[kind];
  let body=`<div class="two"><label>日付<input type="date" id="e-date" value="${esc(def)}"></label><label>時刻(任意)<input type="time" id="e-time" value="${e.t?hm(e.t):''}"></label></div>`;
  if(kind==='camp')body+=`<label>キャンプ場の名前<input type="text" id="e-name" required maxlength="80" value="${esc(c.name||'')}"></label><div class="two"><label>料金(円)<input type="number" id="e-fee" min="0" step="1" inputmode="numeric" value="${c.fee!=null?esc(c.fee):''}"></label><label>評価<select id="e-rate">${[0,1,2,3,4,5].map(n=>`<option value="${n}"${(c.rating||0)===n?' selected':''}>${n?stars(n):'未評価'}</option>`).join('')}</select></label></div><div><div class="hint" style="margin-bottom:4px">設備</div><div class="checks">${FAC.map((f,i)=>`<label><input type="checkbox" id="fac-${i}" value="${esc(f)}"${(c.facilities||[]).includes(f)?' checked':''}>${esc(f)}</label>`).join('')}</div></div>`;
  if(kind==='video')body+=`<label>動画のURL(YouTube・Googleフォトなど)<input type="url" id="e-url" required value="${esc(e.url||'')}" placeholder="https://"></label>`;
  if(kind==='photo'&&safeImg(e.img))body+=`<img src="${safeImg(e.img)}" alt="" style="border-radius:6px;max-height:220px;object-fit:contain">`;
  body+=`<label>${kind==='camp'?'メモ(地面・混雑・水場の様子など)':kind==='photo'?'キャプション':'本文'}<textarea id="e-text" maxlength="8000">${esc(e.text||'')}</textarea></label>`;
  body+=`<label>位置(緯度, 経度)<input type="text" id="e-loc" value="${esc(hasLoc(e)?fmtLoc(e.lat,e.lon):'')}" placeholder="35.68123, 139.76712"></label><div class="row"><button type="button" class="btn ghost small" id="e-pick"${S.proj?'':' disabled'}>地図をタップして指定</button><span class="hint">Googleマップで長押しして出る座標や、場所ページのURLを貼り付けてもOK</span></div>${kind==='camp'?`<div class="row"><a class="btn ghost small" id="e-find" href="#" target="_blank" rel="noopener">Googleマップで名前を探す ↗</a><span class="hint">開いた地図で場所を長押し→出た座標をコピー→上の欄に貼り付け</span></div>`:''}`;
  openSheet(`<h3>${title}${e._id?'を編集':'を追加'}</h3><form class="form" id="f">${body}<div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="f-cancel">やめる</button><button class="btn" id="f-save">保存</button></div></form>`,sh=>{
    sh.querySelector('#f-cancel').onclick=closeSheet;
    const fd=sh.querySelector('#e-find');if(fd){const upd=()=>{const nm=sh.querySelector('#e-name').value.trim(),dt=sh.querySelector('#e-date').value,tm=sh.querySelector('#e-time').value;let ts=null;if(dt&&tm){const[y,m,d]=dt.split('-').map(Number),[hh,mm]=tm.split(':').map(Number);ts=new Date(y,m-1,d,hh,mm).getTime()/1000}const q=locAtTime(ts)||(dt?dayEnd(dt):null);fd.href='https://www.google.com/maps/search/'+encodeURIComponent(nm||'キャンプ場')+(q?'/@'+q[0].toFixed(5)+','+q[1].toFixed(5)+',13z':'')};['#e-name','#e-date','#e-time'].forEach(i=>sh.querySelector(i).addEventListener('input',upd));upd()}
    sh.querySelector('#e-pick').onclick=()=>{$('#scrim').hidden=true;S.pick=(la,lo)=>{sh.querySelector('#e-loc').value=fmtLoc(la,lo);$('#scrim').hidden=false};renderTrip();document.querySelector('.map').scrollIntoView({block:'center',behavior:'smooth'})};
    sh.querySelector('#f').onsubmit=async ev=>{ev.preventDefault();const g=id=>sh.querySelector(id);const date=g('#e-date').value||null;const tm=g('#e-time').value;let ts=null;if(date&&tm){const[y,m,d]=date.split('-').map(Number);const[hh,mm]=tm.split(':').map(Number);ts=new Date(y,m-1,d,hh,mm).getTime()/1000}else if(e.t&&date===e.date&&!tm){ts=null}
      const locS=g('#e-loc').value.trim();const loc=parseLoc(locS);if(locS&&!loc){toast('位置は「35.68123, 139.76712」の形で入力してください');return}
      const data={kind,date,t:ts,text:g('#e-text').value.trim(),lat:loc?loc[0]:null,lon:loc?loc[1]:null};
      if(kind==='camp'){const fee=g('#e-fee').value;data.camp={name:g('#e-name').value.trim(),fee:fee===''?null:Math.max(0,Math.round(+fee)),rating:+g('#e-rate').value,facilities:FAC.filter((f,i)=>g('#fac-'+i).checked)}}
      if(kind==='video'){const u=safeUrl(g('#e-url').value.trim());if(!u){toast('URLは https:// から始まる形で入力してください');return}data.url=u}
      const b=g('#f-save');b.disabled=true;try{const col=S.db.collection('trips/'+S.tripId+'/entries');if(e._id)await col.doc(e._id).update(data);else await col.doc().set({...data,createdBy:S.uid||null,createdAt:new Date().toISOString()});closeSheet();toast('保存しました')}catch(er){b.disabled=false;handleWriteErr(er)}}})}

function importSheet(){const t=S.trip;openSheet(`<h3>取り込む</h3><div class="form">
  <label>GPXファイル(複数可)<input type="file" id="i-gpx" multiple></label>
  <p class="hint">サイクルコンピューターやスマホの記録アプリから書き出したGPX。軌跡は自動で間引いて保存します(距離・獲得標高は間引く前のデータで計算)。</p>
  <hr style="border:0;border-top:1px solid var(--line);width:100%">
  <hr style="border:0;border-top:1px solid var(--line);width:100%">
  <label>Googleマップのタイムライン(JSON)<input type="file" id="i-tl"></label>
  <div class="two"><label>この期間だけ取り込む: 開始<input type="date" id="i-from" value="${esc(t.start||'')}"></label><label>終了<input type="date" id="i-to" value="${esc(t.end||t.start||'')}"></label></div>
  <div id="i-tlres" class="prog"></div>
  <p class="hint">ファイルと期間を選ぶと、Googleが判定した移動区間(自転車・徒歩・車など)が一覧になります。自転車の区間には最初からチェックが入っています。判定が違う区間は、チェックを付け外しして選び直せます。端末から書き出したTimeline.jsonと、Googleデータエクスポートの旧形式に対応していますが、実ファイルでの動作確認はまだです。</p>
  <div class="prog" id="i-prog" aria-live="polite"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="i-close">閉じる</button><button class="btn" id="i-go">取り込み開始</button></div></div>`,sh=>{
  sh.querySelector('#i-close').onclick=()=>{if(!S.busy)closeSheet()};
  let tlJson=null,tlRes=null;const res=sh.querySelector('#i-tlres');
  const range=()=>{const from=sh.querySelector('#i-from').value,to=sh.querySelector('#i-to').value;if(!from||!to||to<from)return null;const[fy,fm,fd]=from.split('-').map(Number),[ty,tm,td]=to.split('-').map(Number);return{from,to,f:new Date(fy,fm-1,fd).getTime(),t:new Date(ty,tm-1,td,23,59,59).getTime()}};
  const sumSel=()=>{if(!tlRes||!tlRes.acts.length)return;const sel=[...res.querySelectorAll('input[data-ai]:checked')].map(c=>tlRes.acts[+c.dataset.ai]);const el=res.querySelector('#i-tlsum');if(el)el.textContent=`${sel.length}区間を選択中・合計 ${km(sel.reduce((a,x)=>a+x.dist,0))} km(地点を直線でつないだ概算)`};
  const analyze=()=>{tlRes=null;if(!tlJson){res.textContent='';return}const r=range();if(!r){res.textContent='期間(開始・終了)を正しく指定してください';return}
    tlRes=analyzeTimeline(tlJson,r.f,r.t);
    if(!tlRes.acts.length){res.innerHTML=tlRes.inRange?`移動手段つきの区間が見つかりませんでした。期間内の全地点(${tlRes.inRange}点)をそのまま取り込みます。`:`期間内の位置が見つかりませんでした(ファイル全体で${tlRes.total}点を認識)。`;return}
    let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px"><button type="button" class="btn ghost small" data-sel="bike">自転車だけ</button><button type="button" class="btn ghost small" data-sel="all">すべて選択</button><button type="button" class="btn ghost small" data-sel="none">すべて外す</button></div><div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px">`;let lastD='';
    tlRes.acts.forEach((a,i)=>{const dk=dkey(a.start);if(dk!==lastD){h+=`<div style="font-weight:700;color:var(--ink);margin-top:6px">${esc(mdj(dk))}</div>`;lastD=dk}h+=`<label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink);padding:3px 0"><input type="checkbox" data-ai="${i}"${a.bike?' checked':''}><span class="num">${hm(a.start/1000)}–${hm(a.end/1000)}</span><span style="${a.bike?'font-weight:700':''}">${esc(ACT_JA[a.type]||a.type)}</span><span class="num muted" style="margin-left:auto">${km(a.dist)} km</span></label>`});
    res.innerHTML=h+`</div><div id="i-tlsum" style="margin-top:4px"></div>`;sumSel()};
  res.addEventListener('change',sumSel);
  res.addEventListener('click',e=>{const b=e.target.closest('[data-sel]');if(!b||!tlRes)return;res.querySelectorAll('input[data-ai]').forEach(c=>{const a=tlRes.acts[+c.dataset.ai];c.checked=b.dataset.sel==='all'||(b.dataset.sel==='bike'&&a.bike)});sumSel()});
  sh.querySelector('#i-tl').onchange=async e=>{const f=e.target.files[0];tlJson=null;tlRes=null;if(!f){res.textContent='';return}res.textContent='タイムラインを読み込み中…(大きいファイルは時間がかかります)';try{tlJson=JSON.parse(await f.text());analyze()}catch(er){res.textContent='JSONとして読めませんでした: '+er.message}};
  sh.querySelector('#i-from').onchange=analyze;sh.querySelector('#i-to').onchange=analyze;
  sh.querySelector('#i-go').onclick=async()=>{const gp=[...sh.querySelector('#i-gpx').files],ph=[],tl=sh.querySelector('#i-tl').files[0];if(!gp.length&&!ph.length&&!tl){toast('ファイルを選んでください');return}
    const prog=sh.querySelector('#i-prog');const go=sh.querySelector('#i-go');go.disabled=true;S.busy=true;const log=[];const say=m=>{prog.textContent=m};let trackChanged=false;
    try{
      for(const f of gp){say('GPXを読み込み中: '+f.name);try{const{segs,name}=parseGPX(await f.text());const st=rawStats(segs);const pk=packTrack(segs);const t0=segs[0][0][3];await S.db.collection('trips/'+S.tripId+'/tracks').doc().set({name:name||f.name.replace(/\.gpx$/i,''),source:'gpx',segs:pk,dist:st.dist,gain:st.gain,days:st.days,t0:t0??null,addedBy:S.uid||null,addedAt:new Date().toISOString()});trackChanged=true;log.push(`GPX「${f.name}」: ${km(st.dist)} km`)}catch(e){if(e&&e.code){throw e}log.push(`GPX「${f.name}」: 読めませんでした(${e.message})`)}}
      if(tl){try{const r=range();if(!r)throw new Error('期間を指定してください');if(!tlJson)throw new Error('ファイルの読み込みが終わっていません');if(!tlRes)analyze();
          let segs,name,note;
          if(tlRes.acts.length){const sel=[...res.querySelectorAll('input[data-ai]:checked')].map(c=>tlRes.acts[+c.dataset.ai]);if(!sel.length)throw new Error('取り込む区間が選ばれていません');segs=sel.map(a=>a.pts);const allBike=sel.every(a=>a.bike);name=`タイムライン(${allBike?'自転車':'選択区間'}) ${mdj(r.from)}${r.to!==r.from?'–'+mdj(r.to):''}`;note=`${sel.length}区間`}
          else{const pr=parseTimeline(tlJson,r.f,r.t);segs=pr.segs;name='タイムライン '+mdj(r.from)+(r.to!==r.from?'–'+mdj(r.to):'');note=`${pr.count}点`}
          if(!segs.length){log.push('タイムライン: 期間内の位置が見つかりませんでした')}
          else{say('タイムラインを保存中…');const st=rawStats(segs.map(s=>s.map(p=>[p[0],p[1],null,p[3]])));const pk=packTrack(segs);await S.db.collection('trips/'+S.tripId+'/tracks').doc().set({name,source:'timeline',segs:pk,dist:st.dist,gain:0,days:st.days,t0:segs[0][0][3],addedBy:S.uid||null,addedAt:new Date().toISOString()});trackChanged=true;log.push(`タイムライン: ${note}、${km(st.dist)} km(地点を直線でつないだ概算)`)}}catch(e){if(e&&e.code)throw e;log.push('タイムライン: '+e.message)}}
      if(trackChanged)await waitTracks();
      let ok=0,ng=0,noloc=0;for(let i=0;i<ph.length;i++){const f=ph[i];say(`写真を処理中 ${i+1}/${ph.length}: ${f.name}`);try{const ex=await readExif(f);const img=await shrink(f);let la=ex.lat,lo=ex.lon;if(la==null){const p=locAtTime(ex.t);if(p){[la,lo]=p}else noloc++}await S.db.collection('trips/'+S.tripId+'/entries').doc().set({kind:'photo',img,text:'',t:ex.t??null,date:ex.t?dkey(ex.t*1000):null,lat:la??null,lon:lo??null,createdBy:S.uid||null,createdAt:new Date().toISOString()});ok++}catch(e){if(e&&e.code)throw e;ng++;log.push(`写真「${f.name}」: ${e.message}`)}}
      if(ph.length)log.unshift(`写真: ${ok}枚を保存${noloc?`(うち${noloc}枚は位置不明)`:''}${ng?`、${ng}枚は失敗`:''}`);
      if(trackChanged)await updateTripSummary();
      say(log.join(' / '));toast('取り込みが終わりました');
    }catch(e){say(log.join(' / '));handleWriteErr(e)}finally{S.busy=false;go.disabled=false}}})}
function waitTracks(){return new Promise(r=>setTimeout(r,900))}
async function updateTripSummary(){let dist=0,gain=0;const pv=[];const all=[];for(const tr of S.tracks){dist+=tr.dist||0;gain+=tr.gain||0;for(const s of segsOf(tr))all.push(s)}const n=all.reduce((a,s)=>a+s.length,0);const step=Math.max(1,Math.ceil(n/240));for(const s of all){const q=s.filter((_,i)=>i%step===0||i===s.length-1).map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]);if(q.length>1)pv.push(q)}try{await S.db.doc('trips/'+S.tripId).update({dist,gain,preview:pv})}catch(e){}}
function handleWriteErr(e){if(e&&e.code==='invalid_argument'&&S.canWrite==null){S.canWrite=false;render()}toast(errMsg(e),5000)}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const mk=ev.target.closest('#mapsvg');
  if(mk&&S.pick&&S.proj){const pt=mk.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(mk.getScreenCTM().inverse());const[la,lo]=S.proj.inv(p.x,p.y);const cb=S.pick;S.pick=null;renderTrip();cb(la,lo);return}
  const g=ev.target.closest('.mk');if(g&&!S.pick){S.sel=g.dataset.id;renderTrip();const el=document.getElementById('e-'+S.sel);el&&el.scrollIntoView({block:'center',behavior:'smooth'});return}
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='backup-out'||a==='trip-out'){const id=a==='trip-out'?S.tripId:null;const nm=a==='trip-out'?safeName((S.trip&&S.trip.title)||'旅'):'全データ';window.NoteStore.saveBlob('自転車旅ノート_'+nm+'_'+dkey(Date.now())+'.json',window.NoteStore.exportData(id));toast('書き出しました。ダウンロードフォルダを確認してください',5000)}
  else if(a==='backup-in'){const f=$('#bk-file');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;try{const r=await window.NoteStore.importText(await file.text());toast(r.docs+'件の記録を読み込みました',5000)}catch(e){toast(e.message||'読み込めませんでした',6000)}};f.click()}
  else if(a==='new-trip')tripForm();
  else if(a==='edit-trip')tripForm(S.trip);
  else if(a==='import')importSheet();
  else if(a==='add')entryForm(b.dataset.kind);
  else if(a==='day-add')entryForm('camp',{kind:'camp',date:b.dataset.date});
  else if(a==='edit-entry'){const e=S.entries.find(x=>x._id===id);e&&entryForm(e.kind,e)}
  else if(a==='del-entry')confirmSheet('この記録を削除しますか？','削除する',()=>S.db.doc('trips/'+S.tripId+'/entries/'+id).delete());
  else if(a==='del-track')confirmSheet('この軌跡を削除しますか？','削除する',async()=>{await S.db.doc('trips/'+S.tripId+'/tracks/'+id).delete();S.tracks=S.tracks.filter(t=>t._id!==id);await updateTripSummary()});
  else if(a==='del-trip')confirmSheet('「'+(S.trip.title||'この旅')+'」を、写真・軌跡ごと削除しますか？','すべて削除',async()=>{const tid=S.tripId;for(const e of S.entries)await S.db.doc('trips/'+tid+'/entries/'+e._id).delete();for(const t of S.tracks)await S.db.doc('trips/'+tid+'/tracks/'+t._id).delete();await S.db.doc('trips/'+tid).delete();location.hash=''});
  else if(a==='gpx-track'){const tr=S.tracks.find(x=>x._id===id);if(tr)exportGPX([tr],(S.trip.title||'旅')+'_'+(tr.name||'軌跡'))}
  else if(a==='gpx-all')exportGPX(S.tracks.slice().sort((x,y)=>(x.t0??9e12)-(y.t0??9e12)),S.trip.title||'旅');
  else if(a==='focus'){S.sel=id;renderTrip();document.querySelector('.map').scrollIntoView({block:'center',behavior:'smooth'})}
  else if(a==='pick-cancel'){S.pick=null;$('#scrim').hidden=false;renderTrip()}
});

/* ---------- data ---------- */
function onErr(e){if(e&&e.code==='revoked'){S.db=null;render()}}
function openTrip(id){S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[];S.tripId=id||null;S.tracks=[];S.entries=[];S.sel=null;S.pick=null;S.trip=id?S.trips.find(t=>t._id===id)||null:null;if(!S.db||!id){render();window.scrollTo(0,0);return}
  const base='trips/'+id;
  S.unsubs.push(S.db.doc(base).onSnapshot(s=>{S.trip=s.exists?{...s.data(),_id:s.id}:null;if(S.tripId===id)renderTrip()},onErr));
  S.unsubs.push(S.db.collection(base+'/tracks').onSnapshot(s=>{S.tracks=s.docs.map(d=>({...d.data(),_id:d.id}));if(S.tripId===id)renderTrip()},onErr));
  S.unsubs.push(S.db.collection(base+'/entries').onSnapshot(s=>{S.entries=s.docs.map(d=>({...d.data(),_id:d.id}));if(S.tripId===id)renderTrip()},onErr));
  render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>openTrip(location.hash.slice(1)));

async function boot(){render();for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));if(!window.claude||!window.claude.use){S.db=null;$('#mode').textContent='保存できません';renderNoDb();return}
  const[db,user,dl]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]);S.db=db;S.user=user;S.dl=dl;
  if(!db){render();return}
  if(user){try{S.uid=await user.id()}catch(e){}try{S.canWrite=await user.can('data.write')}catch(e){S.canWrite=null}}
  S.db.collection('trips').orderBy('start','desc').onSnapshot(s=>{S.trips=s.docs.map(d=>({...d.data(),_id:d.id}));S.tripsLoaded=true;if(!S.tripId)renderList();else if(!S.trip){S.trip=S.trips.find(t=>t._id===S.tripId)||null;renderTrip()}},onErr);
  openTrip(location.hash.slice(1))}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
